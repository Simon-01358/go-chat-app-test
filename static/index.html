<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Step 1: pick a name -->
  <div id="join" class="overlay">
    <form id="join-form" class="join-card">
      <h1>Go Chat</h1>
      <p>Pick a name to join the room.</p>
      <input id="name-input" type="text" maxlength="24" placeholder="Your name" autocomplete="off" required />
      <button type="submit">Join</button>
    </form>
  </div>

  <!-- Step 2: chat -->
  <main id="chat" class="chat hidden">
    <header>
      <strong>Go Chat</strong>
      <span id="presence" class="presence">connecting…</span>
    </header>

    <div id="messages" class="messages"></div>

    <form id="send-form">
      <input id="text-input" type="text" maxlength="500" placeholder="Type a message…" autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
